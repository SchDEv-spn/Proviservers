<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proviservers | Plataforma de servicios locales</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- css de estilos globales o generales -->
    <link rel="stylesheet" href="../assets/estilosGenerales/style.css">
    <link rel="stylesheet" href="../assets/extras/css/login.css">

    <!-- tu css -->
</head>

<body>
    <header>
        <div class="header-container">
            <img src="../assets/img/logos/LOGO PRINCIPAL.png" alt="Logo Proviservers" class="header-logo">
        </div>
    </header>

    <main>
        <div class="custom-container">
            <section id="login">
                <h1>Inicia Sesión</h1>
                <p>Accede a tu cuenta para encontrar o ofrecer servicios locales</p>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" placeholder="usuario@ejemplo.com" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                    </div>
                    <div class="remember-forgot">
                        <label>
                            <input type="checkbox"> Recordarme
                        </label>
                        <a href="reestablecer-Contrasena.html">¿Olvidaste tu contraseña?</a>
                    </div>
                    <button type="submit" class="btn-login">Iniciar Sesión</button>
                </form>
                <div class="register-link">
                    <p>¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
                </div>
            </section>
            <section class="info-section">
                <!-- Carrusel que ocupa el 80% -->
                <div id="infoCarousel" class="carousel slide carousel-custom" data-bs-ride="carousel" data-bs-interval="3000">
                    <div class="carousel-inner">
                        <!-- Slide 1 -->
                        <div class="carousel-item active">
                            <div class="info-card">
                                <h2>Te esperan <br> trabajos muy <br> buenos ! <br> Inicia sesión <br> ahora</h2>
                            </div>
                            <div class="image-container">
                                <img src="../assets/extras/img/women with tab 1.png" alt="Plataforma de trabajo" class="info-image">
                            </div>
                        </div>
                        <!-- Slide 2 -->
                        <div class="carousel-item">
                            <div class="info-card">
                                <h2>Encuentra los <br> mejores <br> profesionales <br> en tu zona</h2>
                            </div>
                            <div class="image-container">
                                <img src="../assets/extras/img/women with tab 1.png" alt="Profesionales" class="info-image">
                            </div>
                        </div>
                        <!-- Slide 3 -->
                        <div class="carousel-item">
                            <div class="info-card">
                                <h2>Ofrece tus <br> servicios y <br> crece tu <br> negocio</h2>
                            </div>
                            <div class="image-container">
                                <img src="../assets/extras/img/women with tab 1.png" alt="Emprendedor" class="info-image">
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <!-- Enlaces / Información -->
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="../assets/extras/js/login.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proviservers | Plataforma de servicios locales</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- css de estilos globales o generales -->
    <link rel="stylesheet" href="../../assets/estilosGenerales/style.css">

    <!-- tu css -->
    <link rel="stylesheet" href="../../assets/dashBoard/css/dashboardPerfil.css">
</head>

<body>
    <!-- SIDEBAR (lateral izquierdo) -->
    <aside class="sidebar">
        <div class="logo">
            <a href="#">
                <img src="../../assets/img/logos/LOGO PRINCIPAL.png" alt="Logo Proviservers">
            </a>
        </div>
        <nav class="menu-principal">
            <ul>
                <li><a href="dashboardAdmin.html">Dashboard</a></li>
                <li><a href="#">Usuarios</a></li>
                <li><a href="dashboardTabla.html">Servicios</a></li>
                <li><a href="#">Categorías de Servicios</a></li>
                <li><a href="#">Reportes</a></li>
                <li><a href="#">Estadísticas</a></li>
            </ul>
        </nav>

        <nav class="menu-secundario">
            <p>Más...</p>
            <ul>
                <li><a href="#">Finanzas</a></li>
                <li><a href="#">Calendario</a></li>
                <li><a href="#">Facturación</a></li>
                <li><a href="#">Marketing</a></li>
                <li><a href="dashboardFormulario.html" class="active">Integraciones</a></li>
            </ul>
        </nav>


        <div class="menu-footer">
            <a href="#">Ajustes</a>
            <a href="../../extras/inicioSesion.html">Cerrar Sesión</a>
        </div>

    </aside>

    <main class="contenido">

        <header class="barra-superior">

            <!--Barra Superior -->
            <div class="buscador">
                <i class="bi bi-search"></i>
                <input type="text" placeholder="Buscar">
            </div>
            <div class="acciones-barra">
                <!-- Notificaiones -->
                <div class="notificaciones item-barra">
                    <i class="bi bi-bell-fill"></i>
                    <span class="badge">6</span>
                </div>

                <!-- Idioma -->
                <div class="idioma item-barra">
                    <img src="../../assets/dashBoard/img/bandera-idioma.png" alt="Foto bandera">
                    <span>English</span>
                    <i class="bi bi-chevron-down"></i>
                </div>

                <!-- Usuario -->
                <div class="usuario item-barra">
                    <img src="../../assets/dashBoard/img/Foto-usuario.png" alt="Foto usuario">
                    <div class="info-usuario">
                        <span class="nombre">Mony Roy</span>
                        <span class="rol">Admin</span>
                    </div>
                    <i class="bi bi-chevron-down"></i>
                </div>

            </div>
        </header>
        <!--     Secciones -->
        <!-- titulo -->
        <section id="titulo-principal">
            <h1>Editar Perfil</h1>
        </section>

        <!-- Formualior admin -->
        <section id="formulario">
            <!-- foto admin -->
            <div class="contenedor-formulario">
                <!-- Sección Foto de Perfil -->
                <div class="seccion-foto">
                    <div class="tarjeta-foto">
                        <div class="foto-perfil">
                            <img src="../../assets/dashBoard/img/Foto-usuario.png" alt="Foto de perfil"
                                id="foto-preview">
                        </div>
                        <label for="foto-input" class="btn-agregar-foto">
                            Cambiar foto
                        </label>
                        <input type="file" id="foto-input" accept="image/*" style="display: none;">
                    </div>
                </div>

                <!-- Formulario -->
                <form action="#" method="post">
                    <div class="row">
                        <div class="col-md-6">
                            <label class="form-label">Nombres</label>
                            <input type="text" class="form-control" placeholder="Mony">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Apellidos</label>
                            <input type="text" class="form-control" placeholder="Roy">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" placeholder="monyroy123@gmail.com">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Número de teléfono</label>
                            <input type="text" class="form-control" placeholder="273-456-2872">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Rol o nivel de acceso</label>
                            <select class="form-select">
                                <option value="">Administrador</option>
                                <option>Administrador</option>
                                <option>Editor</option>
                                <option>Soporte</option>
                            </select>

                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Género</label>
                            <select class="form-select">
                                <option value="">Femenino</option>
                                <option>Masculino</option>
                                <option>Femenino</option>
                                <option>Otro</option>
                            </select>
                        </div>
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-primary">Cambiar</button>
                    </div>
                </form>

        </section>

    </main>


    <footer>
        <!-- Enlaces / Información -->
    </footer>

    <!-- apexcharts -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- tu javaScript -->
    <script src="../../assets/dashBoard/js/dashboard.js"></script>
</body>

</html>

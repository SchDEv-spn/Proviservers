<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <link rel="stylesheet" href="/assets/dashBoard/css/registro.css">
</head>
<body>

  <div id="contenedor">
    <!-- Columna izquierda -->
    <div class="columna izquierda">
      <h1>REGÍSTRATE</h1>
      <p>Crea una cuenta y conecta con expertos o clientes en tu zona.</p>
      
      <form>
        <input type="text" placeholder="Nombre Completo">
        <input type="email" placeholder="Email">
        <input type="text" placeholder="Teléfono">
        <input type="text" placeholder="Ubicación">
        <input type="text" placeholder="Rol">
        <input type="password" placeholder="Contraseña">
        <input type="password" placeholder="Confirmar Contraseña">

        <button type="submit">Crear cuenta</button>
      </form>

      <p class="login-text">¿Ya tienes una cuenta? <a href="#">Inicia sesión aquí</a></p>
    </div>

    <!-- Columna derecha -->
    <div class="columna derecha">
      <div class="contenido-derecha">
        <h2>¡Comienza ahora y encuentra<br>soluciones o nuevas oportunidades!</h2>
        <img src="/assets/img/registro/women with tab 2.png" alt="Imagen persona" class="imagen-persona">
      </div>
    </div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <link rel="stylesheet" href="/assets/extras/css/registro.css">
</head>
<body>

  <div id="contenedor">
    <!-- Columna izquierda -->
    <div class="columna izquierda">
      <h1>REGÍSTRATE</h1>
      <p>Crea una cuenta y conecta con expertos o clientes en tu zona.</p>
      
      <form id="form-registro">
        <input type="text" id="nombre" placeholder="Nombre Completo">
        <input type="email" id="email" placeholder="Email">
        <input type="tel" id="telefono" placeholder="Teléfono">
        <input type="text" id="ubicacion" placeholder="Ubicación">
        <input type="text" id="rol" placeholder="Rol">
        <input type="password" id="contrasena" placeholder="Contraseña">
        <input type="password" id="confirmar" placeholder="Confirmar Contraseña">
        <button id="btn-crear" type="submit">Crear cuenta</button>
     </form>


      <p class="login-text">¿Ya tienes una cuenta? <a href="#">Inicia sesión aquí</a></p>
    </div>

    <!-- Columna derecha -->
    <div class="columna derecha">
      <div class="contenido-derecha">
        <h2>¡Comienza ahora y encuentra<br>soluciones o nuevas oportunidades!</h2>
        <img src="/assets/img/registro/women with tab 2.png" alt="Imagen persona" class="imagen-persona">
      </div>
    </div>
  </div>


  <script src="/assets/extras/js/registro.js"></script>

</body>
</html>
